name: Importar banco

# Sube el index.html actualizado de la web app a webapp/index.html y el banco se reimporta solo.
on:
  push:
    paths: ["webapp/index.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Importar preguntas y fichas
        run: python import_bank.py webapp/index.html | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add banco/preguntas.json banco/fichas.json
          git diff --cached --quiet || (git commit -m "Banco importado $(date +%F)" && (git push || (git pull --rebase && git push)))
