name: Soluciones

# Los reels de reto no enseñan la respuesta. Cada 2 horas (8:00-0:00, hora de España) se contesta a TODOS los comentarios
# de los reels publicados hace 12 h o más (Instagram, TikTok y YouTube) con la solución, para cumplir "te contestamos en
# menos de 24 h". A las 13:00 además: story con la solución de cada reel de ayer y carrusel de TikTok.
on:
  schedule:
    - cron: "0 0,6-22/2 * * *"       # cada 2 h (UTC): 8:00-0:00 en verano, 7:00-1:00 en invierno
  workflow_dispatch:
    inputs:
      dia:
        description: "Día de los reels (AAAA-MM-DD). Vacío = ayer"
        default: ""
      dry_run:
        description: "Solo mostrar lo que haría (no publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: soluciones
  cancel-in-progress: false

jobs:
  soluciones:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: ¿Toca hoy?
        id: gate
        run: echo "go=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.11"
      - if: steps.gate.outputs.go == 'yes'
        run: pip install requests
      - name: Publicar las soluciones de ayer
        if: steps.gate.outputs.go == 'yes'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          SOLUCIONES_TIKTOK: ${{ vars.SOLUCIONES_TIKTOK || 'true' }}
          SOLUCIONES_STORIES: ${{ vars.SOLUCIONES_STORIES || 'true' }}
          SOLUCIONES_RESPUESTAS: ${{ vars.SOLUCIONES_RESPUESTAS || 'true' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python soluciones.py "${{ github.event_name == 'workflow_dispatch' && inputs.dia || '' }}"
      - name: Recordar lo publicado
        if: always() && steps.gate.outputs.go == 'yes'
        run: python sincronizar.py "Soluciones $(date +%F)" soluciones_hechas.json
