name: Reels diarios

on:
  schedule:
    # El programador de GitHub llega tarde (aquí, entre 4 y 9 horas) y a veces ni llega, así que este workflow NO se fía
    # de la hora del cron: se despierta 3 veces por hora y hueco.py decide con la hora real de España si toca el reel de
    # las 14:30 o el de las 21:30. Si llega antes de la hora, lo genera y espera a la hora exacta para publicar; si no
    # toca nada, termina en unos segundos. (Repositorio público: los minutos de Actions son gratis.)
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      formato:
        description: "Formato (auto = lo elige el piloto automático)"
        type: choice
        options: [auto, explicado, pregunta_del_dia, examen_real, error_tipico, truco_memorizar, mito_realidad, simulacro_3, legislacion_30s, caso_practico, flashcards_express]
        default: auto
      estilo:
        description: "Estilo visual (auto = lo elige el piloto automático)"
        type: choice
        options: [auto, marca, clasico, cuaderno, examen, noche, minimal, ilustrado]
        default: auto
      dry_run:
        description: "Solo generar el vídeo (no publicar)"
        type: boolean
        default: true
      programado:
        description: "Como si lo lanzara el reloj: publica el hueco que toque ahora (14:30 o 21:30) a su hora"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write        # avisos.py abre una incidencia si una red deja de publicar

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 240    # incluye la espera hasta la hora exacta del hueco (hasta 3 h) + generar el reel
    steps:
      - uses: actions/checkout@v5

      - name: Elegir hueco
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.programado }}" != "true" ]; then echo "slot=manual" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 hueco.py reel

      - uses: actions/setup-python@v6
        if: steps.slot.outputs.slot != 'skip'
        with:
          python-version: "3.11"
          cache: pip

      - name: Paquetes del sistema
        if: steps.slot.outputs.slot != 'skip'
        run: command -v ffmpeg >/dev/null && command -v espeak-ng >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng)

      - name: Paquetes de Python
        if: steps.slot.outputs.slot != 'skip'
        run: pip install -r requirements.txt

      - name: Caché de modelos de voz y subtítulos
        if: steps.slot.outputs.slot != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: voces-es-v1

      - name: Voz de respaldo (Kokoro)
        if: steps.slot.outputs.slot != 'skip'
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices.bin ]  || curl -sSL -o models/voices.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Generar y publicar
        if: steps.slot.outputs.slot != 'skip'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_IDS: ${{ vars.ELEVENLABS_VOICE_IDS }}
          APP_PREGUNTAS: ${{ vars.APP_PREGUNTAS || '10.000' }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          VOICE_ENGINE: gemini
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Sulafat' }}
          FORMAT_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.formato || 'auto' }}
          STYLE_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.estilo || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.programado && inputs.dry_run || false }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@apruebatcae' }}
          IG_STORY: ${{ vars.IG_STORY || 'true' }}
          TIKTOK: ${{ vars.TIKTOK || 'true' }}
          TIKTOK_CARRUSEL: ${{ vars.TIKTOK_CARRUSEL || 'false' }}
          SOLUCION_MANANA: ${{ vars.SOLUCION_MANANA || 'true' }}
          TIKTOK_STORY_BORRADOR: ${{ vars.TIKTOK_STORY_BORRADOR || 'true' }}
          YOUTUBE: ${{ vars.YOUTUBE || 'true' }}
          PUBLISH_MAX_WAIT_MIN: ${{ vars.PUBLISH_MAX_WAIT_MIN || '200' }}   # espera hasta la hora exacta del hueco
          EXPLICA_DIAS: ${{ vars.EXPLICA_DIAS || '1,3,6' }}        # noches con vídeo explicado: 0 = lunes ... 6 = domingo
          EXPLICA_IMAGENES: ${{ vars.EXPLICA_IMAGENES || 'true' }}
        run: python run_daily.py ${{ steps.slot.outputs.slot }}

      - name: Guardar el vídeo para revisarlo
        if: always() && steps.slot.outputs.slot != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.slot.outputs.slot }}
          path: out/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Recordar preguntas usadas, verificaciones y aprendizajes
        if: always() && steps.slot.outputs.slot != 'skip'
        run: python sincronizar.py "Reel ${{ steps.slot.outputs.slot }} $(date +%F)" used.json log.jsonl review_log.jsonl performance.json performance_tiktok.json strategy_arms.json strategy_report.md playbook.md banco/verificacion.json banco/verificacion_fichas.json banco/informe_verificacion.md image_log.jsonl agents soluciones tendencias.json explicados.json muestras
