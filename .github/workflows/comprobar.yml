name: Comprobar conexiones

# Cada lunes (y a mano): tokens, cuentas, Gemini, reserva de preguntas verificadas y publicaciones de la semana.
# Si algo crítico falla, el workflow sale en rojo y GitHub te avisa por correo.
on:
  schedule:
    - cron: "7 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Comprobar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          APP_PREGUNTAS: ${{ vars.APP_PREGUNTAS || '10.000' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python comprobar.py
      - name: Guardar estado
        if: always()
        run: python sincronizar.py "Estado $(date +%F)" estado.md
