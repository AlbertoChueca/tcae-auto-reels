name: Chuleta diaria

# Carrusel "chuleta visual" (Instagram + TikTok modo foto) a las 18:00 hora de España.
# Interruptor: variable CHULETA = true (por defecto) / false. Tema concreto a mano: campo "tema" (id del tema, p. ej. upp).
on:
  schedule:
    # GitHub lanza los cron con horas de retraso: se despierta 3 veces por hora y hueco.py decide con la hora real de
    # España si toca la chuleta de las 8:00 o la de las 18:00 (si llega antes, la prepara y espera a la hora exacta).
    - cron: "13,33,53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar las imágenes (no publicar)"
        type: boolean
        default: true
      programado:
        description: "Como si lo lanzara el reloj: publica la chuleta que toque ahora (8:00 o 18:00)"
        type: boolean
        default: false
      tema:
        description: "Tema (opcional, p. ej. upp, piel, constantesVitales). Vacío = el que toque"
        default: ""

permissions:
  contents: write
  issues: write        # avisos.py abre una incidencia si una red deja de publicar
  actions: write       # despertar.py lanza el workflow que tenga algo pendiente

concurrency:
  group: chuleta
  cancel-in-progress: false

jobs:
  chuleta:
    runs-on: ubuntu-24.04
    timeout-minutes: 240    # incluye la espera hasta la hora exacta (hasta 3 h)
    steps:
      - uses: actions/checkout@v5
      - name: ¿Toca ahora?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.programado }}" != "true" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; echo "slot=manual" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ vars.CHULETA || 'true' }}" = "false" ]; then echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 hueco.py chuleta
          if grep -q "slot=skip" "$GITHUB_OUTPUT"; then echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Despertar lo pendiente de otros workflows
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHULETA: ${{ vars.CHULETA || 'true' }}
        run: python3 despertar.py reel
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.gate.outputs.go == 'yes'
        run: pip install pillow numpy requests
      - name: Crear y publicar la chuleta
        if: steps.gate.outputs.go == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          APP_PREGUNTAS: ${{ vars.APP_PREGUNTAS || '10.000' }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@apruebatcae' }}
          TIKTOK: ${{ vars.TIKTOK || 'true' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.programado && inputs.dry_run || false }}
          CHULETA_TEMA: ${{ github.event_name == 'workflow_dispatch' && inputs.tema || '' }}
          CHULETA_SLOT: ${{ steps.gate.outputs.slot || 'manual' }}
        run: python chuleta.py
      - name: Guardar las imágenes para revisarlas
        if: always() && steps.gate.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: chuleta
          path: out/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Recordar los temas publicados
        if: always() && steps.gate.outputs.go == 'yes'
        run: python sincronizar.py "Chuleta $(date +%F-%H)" chuletas.json
