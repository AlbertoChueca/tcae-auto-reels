name: Chuleta diaria

# Carrusel "chuleta visual" (Instagram + TikTok modo foto) a las 18:00 hora de España.
# Interruptor: variable CHULETA = true (por defecto) / false. Tema concreto a mano: campo "tema" (id del tema, p. ej. upp).
on:
  schedule:
    - cron: "0 16 * 3-10 *"          # 18:00 verano (CEST)
    - cron: "0 17 * 1-3,10-12 *"     # 18:00 invierno (CET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar las imágenes (no publicar)"
        type: boolean
        default: true
      tema:
        description: "Tema (opcional, p. ej. upp, piel, constantesVitales). Vacío = el que toque"
        default: ""

permissions:
  contents: write

concurrency:
  group: chuleta
  cancel-in-progress: false

jobs:
  chuleta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: ¿Toca hoy?
        id: gate
        run: |
          S="${{ github.event.schedule }}"
          if [ -n "$S" ] && [ "${{ vars.CHULETA || 'true' }}" = "false" ]; then echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$S" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          UTC_H=$(echo "$S" | awk '{print $2}')
          OFF=$(TZ=Europe/Madrid date +%z | cut -c2-3 | sed 's/^0//')
          if [ $(( (UTC_H + OFF) % 24 )) -eq 18 ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.gate.outputs.go == 'yes'
        run: pip install pillow numpy requests
      - name: Crear y publicar la chuleta
        if: steps.gate.outputs.go == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          APP_PREGUNTAS: ${{ vars.APP_PREGUNTAS || '10.000' }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@apruebatcae' }}
          TIKTOK: ${{ vars.TIKTOK || 'true' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          CHULETA_TEMA: ${{ github.event_name == 'workflow_dispatch' && inputs.tema || '' }}
        run: python chuleta.py
      - name: Guardar las imágenes para revisarlas
        if: always() && steps.gate.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: chuleta
          path: out/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Recordar los temas publicados
        if: always() && steps.gate.outputs.go == 'yes'
        run: python sincronizar.py "Chuleta $(date +%F)" chuletas.json
