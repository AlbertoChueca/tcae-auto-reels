name: Verificar banco

on:
  schedule:
    - cron: "17 3 * * *"     # cada noche verifica una tanda de preguntas nuevas
  workflow_dispatch:
    inputs:
      cuantas:
        description: "Cuántas preguntas pendientes verificar"
        default: "120"

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Verificar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python verifier.py ${{ inputs.cuantas || '80' }}
      - name: Guardar resultados
        if: always()
        run: python sincronizar.py "Verificación $(date +%F)" banco/verificacion.json banco/verificacion_fichas.json banco/informe_verificacion.md
